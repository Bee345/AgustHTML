<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock & Alarm</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>
    <section class="clock-container">
  <h1 class="clock" id="clock">00:00:00</h1>

  <div class="alarm-box">
    <h3>Set Alarm</h3>
    <input type="time" id="alarmTime"/>
    <button id="setAlarmBtn">Set-Alarm</button>
    <button id="clearAlarmBtn">Clear-Alarm</button>
  </div>
  <p id="status"></p>
    </section>
    <audio id="alarm-Sound"> 
    <source src="Future-WORST-DAY-(TopGhanaMusic.Com).mp3" type="audio/mp3">
  </audio>

  <script src="clock.js"></script>
</body>
</html>
