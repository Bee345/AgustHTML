<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Inline SVG — Health Icon</title>
<style>
  :root{
    --bg:#f6f8fb;
    --card:#fff;
    --accent-pink: #ff6384;
    --accent-purple: #6b46c1;
    --muted:#6b7280;
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(180deg,var(--bg), #eef2f7);
    color:var(--muted);
  }

  .card{
    width:clamp(280px, 46vw, 720px);
    background:var(--card);
    border-radius:14px;
    padding:28px;
    box-shadow: 0 10px 30px rgba(39,49,66,0.08);
    display:flex;
    gap:20px;
    align-items:center;
  }

  .icon-wrap{
    width:96px;
    height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background: linear-gradient(135deg, rgba(107,70,193,0.08), rgba(255,99,132,0.06));
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .card:hover .icon-wrap{
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 12px 30px rgba(107,70,193,0.08);
  }

  /* target shapes inside the SVG by ids/classes */
  svg .heart {
    transform-origin: 50% 50%;
    transition: transform .25s ease;
  }

  /* subtle heartbeat animation */
  @keyframes heartbeat {
    0%   { transform: scale(1); }
    20%  { transform: scale(1.06); }
    40%  { transform: scale(0.98); }
    60%  { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  /* play on hover for demo */
  .card:hover svg .heart {
    animation: heartbeat 900ms ease-in-out;
  }

  .meta {
    flex:1;
  }
  h1 { margin:0 0 6px 0; font-size:18px; color:#111827; }
  p { margin:0; font-size:14px; color:var(--muted); }
  .sub { margin-top:8px; font-size:12px; color:#94a3b8; }
</style>
</head>
<body>
  <div class="card" role="region" aria-label="Health icon demo">
    <div class="icon-wrap" aria-hidden="true">
      <!-- Inline SVG: you can change stroke/fill directly in CSS by targeting ids/classes -->
      <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1">
        <title id="t1">Heart with pulse</title>

        <!-- rounded square background (uses currentColor if needed) -->
        <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="#ffffff" stroke="#E6E9F2" stroke-width="2"/>

        <!-- Heart (class applied so CSS can animate it) -->
        <path class="heart" d="M32 44s-1.8-1.6-6.2-5.1C21.9 36 16 32 16 26.5 16 22 19.5 19 23.3 19c2.6 0 4.7 1.3 5.7 3.1C30 20.3 32.1 19 34.7 19 38.5 19 42 22 42 26.5c0 5.5-6 9.5-9.8 12.4C33.8 42.4 32 44 32 44z"
              fill="var(--accent-pink)"/>
        
        <!-- Pulse line -->
        <path d="M12 36h6l4-8 3 12 4-8 6 0" fill="none" stroke="var(--accent-purple)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="meta">
      <h1>Health — Blood pressure</h1>
      <p>Simple icon made with SVG. The heart shape is animated on hover to demonstrate SVG + CSS interaction.</p>
      <div class="sub">Tip: edit the <code>fill</code> or <code>stroke</code> values in the SVG or change the CSS variables at the top for theme colors.</div>
    </div>
  </div>
</body>
</html>
