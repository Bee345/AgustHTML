<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkMode El</title>
    <link rel="stylesheet" href="Dark.css">
    <link rel="stylesheet" href="./fontawesome7/css/all.min.css">
</head>
<body>
    <!-- This is the Place i built the structure -->
     <main class="container" role="main">
    <div class="subContainer">
        <div>
            <h1>My DarkMode WebPage.</h1>
            <p id="lead">A Simple example showing dark mode using CSS variable and a toggle.</p>
        </div>

        <!-- Toggle -->
         <button id="themeToggle" class="theme-toggle" aria-pressed="false" aria-label="ToggleDark Mode">
        <span class="toggle-icon" id="toggleIcon" aria-hidden="true"></span>
        <span id="toggleLabel">Dark Mode</span>
         </button>
    </div>
    <section class="card">
        <h2>Content Area</h2>
        <p>This Is a Simple content, Colors, Shadows, and backgrounds switch when u toggle dark mode</p>
        <img src="Lil Wayne1.jpg" alt="Just An image of Lil Wayne" class="theme-aware">
    </section>
     </main>

     <!-- Link Thi JS -->
      <script src="Dark.js"></script>
</body>
</html>
